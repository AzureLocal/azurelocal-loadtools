# =============================================================================
# Azure DevOps Pipeline - VMFleet Execution
# =============================================================================
# Runs the VMFleet load test pipeline on a self-hosted agent.
# Requires: Self-hosted agent with WinRM access to Azure Local cluster.
# =============================================================================

trigger: none  # Manual trigger only

parameters:
  - name: clusterConfig
    displayName: 'Cluster config file'
    type: string
    default: 'example-cluster.yml'
  - name: profile
    displayName: 'Workload profile'
    type: string
    default: 'general.yml'
  - name: skipCleanup
    displayName: 'Skip cleanup after test'
    type: boolean
    default: false
  # The variable group that holds CLUSTER_ADMIN_USERNAME and CLUSTER_ADMIN_PASSWORD. Its name is chosen per Azure DevOps
  # project: set it when you run the pipeline, or change the default here. A template expression, so it is resolved when the
  # pipeline is compiled, before the group is authorized; a runtime variable $(...) can't name the group.
  - name: variableGroup
    displayName: 'Variable group with the cluster credentials'
    type: string
    default: 'azurelocal-loadtest-secrets'
  # The self-hosted agent pool that reaches the cluster over WinRM. Its name is chosen per Azure DevOps organization, so it
  # has no default and the run form asks for it. It can't come from a variable: Learn says a macro variable $(name) is
  # expanded only in task inputs (https://learn.microsoft.com/azure/devops/pipelines/process/variables#understand-variable-syntax),
  # and the template expression ${{ variables.name }} does not see variables stored on the pipeline or in a library
  # (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions). A runtime parameter is resolved when
  # the pipeline is compiled (https://learn.microsoft.com/azure/devops/pipelines/process/runtime-parameters).
  - name: agentPool
    displayName: 'Self-hosted agent pool with WinRM access to the cluster'
    type: string
  # Job timeout. 120 minutes is Loadtools' own limit, not a figure from Microsoft (not measured on a cluster), meant to
  # cover Install, Deploy (the fleet VMs from the base VHDX), one pass of a shipped profile (the longest,
  # failure-injection.yml, holds the workload 20 minutes after a 2-minute warmup), Collect, Report and Cleanup.
  # Raise it for more VMs per node, more iterations or a longer profile.
  - name: jobTimeoutMinutes
    displayName: 'Job timeout in minutes'
    type: number
    default: 120

variables:
  - group: ${{ parameters.variableGroup }}  # Variable group with credentials (pipeline input variableGroup)

stages:
  - stage: LoadTest
    displayName: 'VMFleet Load Test'
    jobs:
      - job: VMFleet
        displayName: 'Execute VMFleet Pipeline'
        pool:
          name: ${{ parameters.agentPool }}
        timeoutInMinutes: ${{ parameters.jobTimeoutMinutes }}
        steps:
          - task: PowerShell@2
            displayName: 'Initialize Environment'
            inputs:
              targetType: filePath
              filePath: common/helpers/Initialize-Environment.ps1
              arguments: >
                -ProjectRoot $(Build.SourcesDirectory)
                -ClusterConfigPath $(Build.SourcesDirectory)/config/clusters/${{ parameters.clusterConfig }}
                -Solution VMFleet
              pwsh: true

          - task: PowerShell@2
            displayName: 'Run VMFleet Pipeline'
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $secPassword = ConvertTo-SecureString '$(CLUSTER_ADMIN_PASSWORD)' -AsPlainText -Force
                $credential = New-Object PSCredential('$(CLUSTER_ADMIN_USERNAME)', $secPassword)

                $params = @{
                  ClusterConfigPath = "$(Build.SourcesDirectory)/config/clusters/${{ parameters.clusterConfig }}"
                  ProfilePath       = "$(Build.SourcesDirectory)/tools/vmfleet/config/profiles/${{ parameters.profile }}"
                  ProjectRoot       = "$(Build.SourcesDirectory)"
                  Credential        = $credential
                  ReportFormats     = @('PDF', 'XLSX')
                }

                if ('${{ parameters.skipCleanup }}' -eq 'True') {
                  $params['SkipCleanup'] = $true
                }

                & "$(Build.SourcesDirectory)/tools/vmfleet/Invoke-VMFleetPipeline.ps1" @params

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Reports'
            condition: always()
            inputs:
              PathtoPublish: reports
              ArtifactName: vmfleet-reports

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Logs'
            condition: always()
            inputs:
              PathtoPublish: logs
              ArtifactName: vmfleet-logs
