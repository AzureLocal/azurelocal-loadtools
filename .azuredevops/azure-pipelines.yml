# =============================================================================
# Azure DevOps Pipeline - Validate (parity with .github/workflows/ci.yml)
# =============================================================================
# Runs the same script as GitHub Actions: tests/Invoke-CiChecks.ps1
#   - PSScriptAnalyzer with .psscriptanalyzer.psd1 (errors fail, more than 50 warnings fail)
#   - Pester, one process per suite
#   - relative Markdown link check
# Nothing here needs a cluster, a tenant or a secret. The VMFleet run pipeline is
# azure-pipelines-vmfleet.yml and needs a self-hosted agent with cluster access.
# =============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - common/**
      - tools/**
      - tests/**
      - docs/**
      - config/**
      - .psscriptanalyzer.psd1

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

steps:
  - task: PowerShell@2
    displayName: 'Install modules (Pester 5.9.1, PSScriptAnalyzer 1.25.0, powershell-yaml 0.4.12)'
    inputs:
      targetType: inline
      pwsh: true
      script: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
        Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
        Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

  - task: PowerShell@2
    displayName: 'Static analysis'
    inputs:
      targetType: filePath
      filePath: tests/Invoke-CiChecks.ps1
      arguments: '-Check Analyzer -MaxWarnings 50 -ResultPath $(Build.ArtifactStagingDirectory)/ci-analyzer.json'
      pwsh: true

  - task: PowerShell@2
    displayName: 'Pester suites'
    condition: succeededOrFailed()
    inputs:
      targetType: filePath
      filePath: tests/Invoke-CiChecks.ps1
      arguments: '-Check Pester -ResultPath $(Build.ArtifactStagingDirectory)/ci-pester.json'
      pwsh: true

  - task: PowerShell@2
    displayName: 'Markdown links'
    condition: succeededOrFailed()
    inputs:
      targetType: filePath
      filePath: tests/Invoke-CiChecks.ps1
      arguments: '-Check Links -ResultPath $(Build.ArtifactStagingDirectory)/ci-links.json'
      pwsh: true

  - task: PublishBuildArtifacts@1
    displayName: 'Keep the results'
    condition: always()
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'ci-results'
