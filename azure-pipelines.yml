# Azure DevOps Pipeline Trigger for azurelocal-loadtools
# Governed centrally in HCS Platform Engineering

trigger:
  branches:
    include:
      - main
      - master
      - feature/*

pr:
  branches:
    include:
      - main
      - master

# The repository resource names the central HCS Platform Engineering template repository that governs this repository's
# module CI; it is not a value a deployment chooses, and nothing here runs against a cluster. Learn: expressions are not
# expanded in a resource like repositories (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions).
# moduleName is this repository's name.
resources:
  repositories:
    - repository: platform
      type: git
      name: Platform Engineering/platform

extends:
  template: .ado/pipelines/reusable/ps-module-ci.yml@platform
  parameters:
    moduleName: 'azurelocal-loadtools'
    runMaproomTests: true
