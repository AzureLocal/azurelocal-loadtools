<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A86D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003A70;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#001A3A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="38" ry="38" fill="url(#bgGrad)"/>

  <g opacity="0.08" stroke="white" stroke-width="0.8">
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
  </g>

  <g transform="translate(100,32)" filter="url(#shadow)">
    <polygon points="0,-14 14,-5 10,12 0,7 -10,12 -14,-5" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="white">L</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="100" cy="100" r="46" fill="white"/>
    <circle cx="100" cy="100" r="38" fill="url(#bgGrad)"/>

    <!-- Baseline -->
    <line x1="72" y1="117" x2="130" y2="117" stroke="#E74C3C" stroke-width="1.5" opacity="0.60"/>

    <!-- Bar chart (5 bars, bottom at y=117) -->
    <rect x="75" y="105" width="8" height="12" rx="1.5" fill="#E74C3C" opacity="0.55"/>
    <rect x="87" y="93" width="8" height="24" rx="1.5" fill="#E74C3C" opacity="0.70"/>
    <rect x="99" y="82" width="8" height="35" rx="1.5" fill="#E74C3C" opacity="0.90"/>
    <rect x="111" y="89" width="8" height="28" rx="1.5" fill="#E74C3C" opacity="0.75"/>
    <rect x="123" y="98" width="8" height="19" rx="1.5" fill="#E74C3C" opacity="0.60"/>

    <!-- Trend line -->
    <polyline points="79,101 91,89 103,79 115,85 127,94" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.60"/>

    <!-- Trend arrow up-right -->
    <line x1="114" y1="79" x2="128" y2="72" stroke="white" stroke-width="1.8" opacity="0.80"/>
    <polygon points="128,72 120,73 124,80" fill="white" opacity="0.80"/>

    <circle cx="100" cy="100" r="38" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  </g>

  <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="white" letter-spacing="1" opacity="0.95">AZURE LOCAL</text>
  <text x="100" y="186" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#E74C3C" letter-spacing="1.5" opacity="0.95">LOAD TOOLS</text>
</svg>
