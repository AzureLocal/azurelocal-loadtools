# =============================================================================
# variables.example.yml
# Central configuration — single source of truth for load testing deployments.
#
# Copy this file to variables.yml and fill in your values:
#   cp config/variables.example.yml config/variables.yml
#
# DO NOT commit variables.yml — it is excluded by .gitignore.
#
# Key Vault References:
#   Secrets use keyvault:// URIs and are resolved at runtime.
#   Format: keyvault://<vault-name>/<secret-name>
#   NEVER put actual passwords or secrets in this file.
#
# Detailed configs live in subdirectories:
#   - config/clusters/         Cluster definitions (per-cluster YAML)
#   - config/credentials/      Key Vault credential mappings
#   - config/profiles/         Workload profiles (vmfleet, fio, iperf, etc.)
#   - config/variables/        Master variable registry and solution schemas
# =============================================================================


# =============================================================================
# Azure
# =============================================================================
azure:
  subscription_id: "00000000-0000-0000-0000-000000000000"
  tenant_id: "00000000-0000-0000-0000-000000000000"
  resource_group: "rg-loadtools-eus-01"
  location: "eastus"


# =============================================================================
# Key Vault
# =============================================================================
keyvault:
  name: "kv-iic-loadtools"
  auth_method: "az_cli"                       # managed_identity | service_principal | az_cli


# =============================================================================
# Azure Local Cluster
# =============================================================================
azure_local:
  cluster_name: "azl-cluster-01"
  cluster_domain: "iic.local"
  custom_location_id: "/subscriptions/00000000-0000-0000-0000-000000000000/providers/Microsoft.ExtendedLocation/customLocations/azl-cluster-01-cl"
  storage_path_id: "/subscriptions/00000000-0000-0000-0000-000000000000/providers/Microsoft.AzureStackHCI/storageContainers/sp-vmstore-01"
  nodes:
    - name: "azl-node-01"
      management_ip: "10.0.0.1"
      storage_ip: "10.0.1.1"
      role: "worker"                           # worker | controller | management
    - name: "azl-node-02"
      management_ip: "10.0.0.2"
      storage_ip: "10.0.1.2"
      role: "worker"


# =============================================================================
# Storage
# =============================================================================
storage:
  csv_path: "C:\\ClusterStorage\\Volume1"
  collect_volume_path: "C:\\ClusterStorage\\Collect"
  base_vhd_path: "C:\\ClusterStorage\\Collect\\BaseImage.vhdx"


# =============================================================================
# Networking
# =============================================================================
networking:
  management:
    subnet: "10.0.0.0/24"
    vlan_id: 0
  storage:
    subnet: "10.0.1.0/24"
    vlan_id: 100
    rdma_enabled: true
  compute:
    subnet: "10.0.2.0/24"
    vlan_id: 200


# =============================================================================
# Credentials (mapped to Key Vault secrets)
# =============================================================================
credentials:
  cluster_admin_username: "keyvault://kv-iic-loadtools/hci-cluster-admin-user"
  cluster_admin_password: "keyvault://kv-iic-loadtools/hci-cluster-admin-pwd"
  vmfleet_admin_username: "keyvault://kv-iic-loadtools/vmfleet-admin-user"
  vmfleet_admin_password: "keyvault://kv-iic-loadtools/vmfleet-admin-pwd"
  linux_ssh_username: "azurelocaladmin"       # SSH user for fio/iPerf3/stress-ng on cluster nodes
  linux_ssh_key_path: "~/.ssh/id_rsa"         # Path to SSH private key on the runner


# =============================================================================
# Testing Defaults
# =============================================================================
testing:
  default_tool: "vmfleet"                     # vmfleet | fio | iperf | hammerdb | stress-ng
  default_profile: "general"                  # Profile name from config/profiles/<tool>/
  duration_seconds: 300
  warmup_seconds: 60


# =============================================================================
# VMFleet
# =============================================================================
vmfleet:
  # Installation
  version: "2.0.0.0"                          # VMFleet module version to install
  diskspd_version: "2.1.0"                    # DiskSpd version to install alongside VMFleet

  # VM Fleet sizing (per-node)
  vm_count: 10                                # Fleet VMs per cluster node
  vm_memory_gb: 2                             # Memory per fleet VM (GB)
  vm_processors: 2                            # vCPU count per fleet VM
  data_disk_size_gb: 20                       # Data disk size per fleet VM (GB)
  data_disk_count: 1                          # Number of data disks per fleet VM

  # Workload defaults (override per profile in config/profiles/vmfleet/)
  block_size: "4k"                            # Default I/O block size
  write_ratio: 0                              # Write percentage (0=read-only, 100=write-only)
  random_ratio: 100                           # Random I/O percentage (0=sequential)
  outstanding_io: 8                           # Outstanding I/O per thread
  threads_per_vm: 2                           # I/O threads per fleet VM
  test_duration_seconds: 300                  # Default test duration
  warmup_seconds: 60                          # Warmup period before measurement


# =============================================================================
# HammerDB
# =============================================================================
hammerdb:
  db_server: ""                               # Hostname or IP of the target SQL Server instance
  db_type: "mssql"                            # Target database: mssql | postgresql | mysql
  db_name: "tpcc"                             # Database name for TPC-C workload
  warehouse_count: 10                         # Number of TPC-C warehouses
  virtual_users: 4                            # Concurrent virtual users


# =============================================================================
# Monitoring & Reporting
# =============================================================================
monitoring:
  log_analytics_workspace_id: "00000000-0000-0000-0000-000000000000"
  log_analytics_shared_key: "keyvault://kv-iic-loadtools/log-analytics-key"
  enable_real_time: true
  collection_interval_seconds: 10

reporting:
  output_dir: "reports"
  format: "html"                              # html | json | csv
  include_charts: true


# =============================================================================
# WinRM
# =============================================================================
winrm:
  port: 5985
  use_ssl: false
  authentication: "Kerberos"                  # Kerberos | Negotiate | Basic
  operation_timeout_seconds: 300


# =============================================================================
# Tags
# =============================================================================
tags:
  project: "LoadTools"
  environment: "production"
  workload: "performance-testing"
  solution: "loadtools-azure-local"
